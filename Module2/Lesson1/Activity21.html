<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Positioning Types</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    .demo {
      width: 280px;
      height: 120px;
      border: 2px solid #333;
      background: #dff0ff;
      margin: 20px auto;
      text-align: center;
      line-height: 120px;
      font-weight: bold;
      position: relative;
    }

    .static-box {
      position: static;
      background: #c8e6c9;
    }

    .relative-box {
      position: relative;
      left: 30px;
      top: 10px;
      background: #ffe082;
    }

    .absolute-box {
      position: absolute;
      right: 20px;
      top: 20px;
      width: 160px;
      height: 80px;
      background: #ffccbc;
      line-height: 80px;
    }

    .fixed-box {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 180px;
      height: 70px;
      background: #ce93d8;
      line-height: 70px;
      color: white;
    }

    .sticky-box {
      position: sticky;
      top: 0;
      background: #90caf9;
      padding: 15px;
      border: 2px solid #1565c0;
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .container {
      position: relative;
      width: 500px;
      height: 230px;
      margin: 20px auto;
      border: 2px dashed #666;
      background: white;
      padding: 10px;
    }

    h2 {
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>
  <h2>CSS Positioning Types</h2>

  <div class="demo static-box">Static</div>
  <div class="demo relative-box">Relative</div>

  <div class="container">
    <div class="absolute-box">Absolute</div>
    <div style="padding-top: 40px; text-align: center;">Container for absolute positioning</div>
  </div>

  <div class="sticky-box">Sticky</div>

  <div class="demo" style="margin-top: 40px;">Normal Box</div>
  <div class="fixed-box">Fixed</div>
</body>
</html>
