<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opacity Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 30px;
    }

    .box {
      width: 300px;
      height: 180px;
      margin: 20px auto;
      background: #4CAF50;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border-radius: 10px;
      opacity: 0.5; /* semi-transparent */
    }

    .box2 {
      width: 300px;
      height: 180px;
      margin: 20px auto;
      background: #2196F3;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border-radius: 10px;
      opacity: 1; /* fully opaque */
    }
  </style>
</head>
<body>
  <h2>Opacity Property Example</h2>
  <div class="box">Transparent Box</div>
  <div class="box2">Opaque Box</div>
</body>
</html>
