<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Model Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      padding: 30px;
    }

    .box {
      width: 300px;
      background-color: #dfefff;
      border: 5px solid #1e88e5;
      padding: 25px;
      margin: 30px auto;
      text-align: center;
      font-size: 20px;
      color: #0d47a1;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #0d47a1;
    }
  </style>
</head>
<body>
  <h2>Box Model</h2>

  <div class="box">
    This box shows content, padding, border, and margin.
  </div>
</body>
</html>
