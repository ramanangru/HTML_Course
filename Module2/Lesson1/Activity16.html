<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Properties and Values</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background-color: white;
      border: 2px solid #2196F3;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #0d47a1;
      text-align: center;
      font-size: 32px;
      text-decoration: underline;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #444;
    }

    .button {
      display: inline-block;
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSS Properties and Values</h1>
    <p>
      This is an example of different CSS properties like <strong>color</strong>,
      <strong>background-color</strong>, <strong>border</strong>,
      <strong>padding</strong>, <strong>font-size</strong>, and <strong>border-radius</strong>.
    </p>
    <a href="#" class="button">Click Me</a>
  </div>
</body>
</html>
